schema: spec-driven
context: |
  Пишите документацию по-русски, сохраняя служебные заголовки OpenSpec на английском.
  CF Timer перезапускается после незавершенного rewrite; архив не является рабочим baseline.
  Владелец подтвердил: бесплатный пилот в 1–3 залах; экран — компьютер + телевизор.
  Smart TV и Android TV вне пилота. Начатый таймер продолжает идти без интернета.
  Локальный экран — источник истины времени; в remote-сценарии телефон — пульт, сервер — комнаты, доступ и relay.
  Обычный вход на смартфоне — самостоятельный таймер без QR; явное приглашение открывает пульт общего экрана.
  Большие экраны предлагают сворачиваемый QR. Код и трансляция — отдельный backlog после QR-пилота.
  Принятый владельцем стек: TypeScript, React, Vite, Tailwind 4, Node 24 LTS, ws, Vitest, Playwright.
  Нет аккаунтов и роли тренера. Первый пульт подключается свободно; второй просит передачу у первого.
  Один активный пульт. Через 60 секунд без связи текущего пульта новый получает управление без согласия.
  Reload компьютера сбрасывает таймер и сессию; reload телефона-пульта только восстанавливает действующее право.
  Сервер хранит только временные сессии и журналы; диагностика по SSH, без web admin.
  Основной UI-референс timer.crosshero.com; направление ImageGen-макетов принято владельцем.
  Локальный runtime реализован и опубликован как статический сайт; приёмка на реальных устройствах открыта. QR remote0.2.0 опубликован после разрешения владельца; browser/live/PWA проверки пройдены с записанным ограничением WebKit. Полная продуктовая диагностика и аппаратный пилот открыты.
  Не выдавать предложенные или непроверенные функции за готовый пилот.
  Сначала bootstrap-timer-pilot, затем add-qr-remote-control; развёртывание отдельным change.
  Макеты design/ — визуальные референсы; предлагаемые UX-поправки в docs/ux.md.
rules:
  proposal:
    - Указывайте пользовательскую пользу, границы и зависимости; не обещайте сроки без данных.
  specs:
    - Используйте SHALL/MUST и WHEN/THEN; каждое требование должно иметь проверяемый сценарий.
    - Различайте online, потерю сети во время работы, cached offline startup и offline remote.
    - Описывайте граничные случаи времени, потерю связи, подтверждения и изоляцию комнат.
  design:
    - Отделяйте подтверждённые ограничения от допущений и открытых вопросов.
    - Не вводите аккаунты, платежи, Redis или сложную иерархию классов без конкретной нужды.
  tasks:
    - Каждая задача должна ссылаться на проверяемое поведение; невыполненные задачи не отмечать.
    - Проверки должны покрывать время, браузерные ограничения и фактическое оборудование пилота.
