# Include inside the EXISTING HTTPS server{} for timer.lyamin.org.
# Administrator must inspect the current vhost first. Do not replace it wholesale.
location = /ws {
    proxy_pass http://127.0.0.1:43980;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    # Overwrite, never append a client-supplied chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;
    proxy_buffering off;
}
location = /healthz {
    proxy_pass http://127.0.0.1:43980;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
# Verified vhost root is readable by www-data (member of timer group).
location = / {
    try_files /index.html =404;
    expires -1;
}
location = /index.html {
    try_files $uri =404;
    expires -1;
}
location = /sw.js {
    try_files $uri =404;
    expires -1;
}
location = /manifest.webmanifest {
    try_files $uri =404;
    expires -1;
}
location = /remote {
    return 308 /remote/;
}
location = /remote/ {
    try_files /remote/index.html /index.html =404;
    expires -1;
}
location ^~ /assets/ {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://timer.lyamin.org; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
